<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Sign in — DriveEase</title><link rel="stylesheet" href="/theme.css"><style>body{min-height:100vh;display:grid;place-items:center}.auth{width:min(430px,92%);background:white;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:var(--shadow)}.auth h1{font-size:34px}.auth p{color:var(--muted);line-height:1.6}.auth input{width:100%;height:48px;border:1px solid var(--line);border-radius:11px;padding:0 14px;font:500 15px 'DM Sans';box-sizing:border-box;margin:8px 0}.msg{min-height:20px;font-size:13px;color:var(--muted)}.msg.err{color:#a33}.auth button{width:100%;margin-top:10px}.brand{font:800 20px Manrope;margin-bottom:28px}.brand span{color:var(--brand)}</style></head><body><main class="auth"><div class="brand">Drive<span>Ease</span></div><h1 id="title">Welcome back</h1><p id="sub">Sign in with your email. We'll send a one-time code — no password needed.</p><form id="form"><input id="email" type="email" placeholder="you@example.com" autocomplete="username webauthn" required><input id="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code" hidden><button id="submit" class="btn btn-brand">Continue</button><button id="back" type="button" class="btn btn-soft" hidden>Use a different email</button></form><div id="passkey" hidden><p>Add a passkey so future sign-ins can use your fingerprint, face, or screen lock.</p><button id="add" class="btn btn-dark">Add a passkey</button><button id="skip" class="btn btn-soft">Not now</button></div><div id="msg" class="msg"></div></main><script>(async()=>{const A=window.hatchable.auth,form=document.querySelector('#form'),email=document.querySelector('#email'),code=document.querySelector('#code'),submit=document.querySelector('#submit'),back=document.querySelector('#back'),msg=document.querySelector('#msg'),passkey=document.querySelector('#passkey');let step='email',has=false;const next=()=>{const n=new URLSearchParams(location.search).get('next')||'/';return n.startsWith('/')&&!n.startsWith('//')?n:'/'};const go=()=>location.replace(next());const set=(x,e)=>{msg.textContent=x||'';msg.className='msg'+(e?' err':'')};const s=await A.getSession().catch(()=>null);if(s&&s.user){go();return}form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{if(step==='email'){const r=await A.startLogin({email:email.value.trim()});has=!!r.has_passkey;if(has&&A.supportsPasskeys()){try{const d=await A.signInWithPasskey({email:email.value.trim()});if(d&&d.user){go();return}}catch{}}step='code';email.hidden=true;code.hidden=false;back.hidden=false;submit.textContent='Sign in';document.querySelector('#title').textContent='Enter your code';document.querySelector('#sub').textContent='We sent a 6-digit code to '+email.value.trim();set('Code sent.');code.focus()}else{const d=await A.verifyCode({email:email.value.trim(),code:code.value.trim()});if(d&&d.user){if(!has&&A.supportsPasskeys()&&localStorage.getItem('driveease_passkey_declined')!=='1'){form.hidden=true;passkey.hidden=false;document.querySelector('#title').textContent='Make sign-in faster';document.querySelector('#sub').textContent='One quick setup for future visits.'}else go()}}}catch(err){set(err.message||'Something went wrong. Please try again.',true)}finally{submit.disabled=false}};back.onclick=()=>{step='email';email.hidden=false;code.hidden=true;back.hidden=true;submit.textContent='Continue';set('');email.focus()};document.querySelector('#add').onclick=async()=>{try{await A.registerPasskey()}catch{}go()};document.querySelector('#skip').onclick=()=>{localStorage.setItem('driveease_passkey_declined','1');go()};email.focus()})()</script></body></html>

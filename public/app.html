<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DriveEase — Book a car</title><link rel="stylesheet" href="/theme.css"></head><body><header class="container nav"><a class="logo" href="/">Drive<span>Ease</span></a><div style="display:flex;gap:10px;align-items:center"><a href="/bookings.html" class="btn btn-soft">My bookings</a><span id="user" style="font-size:13px;color:var(--muted)"></span><button id="out" class="btn btn-soft">Sign out</button></div></header><main class="container section" style="padding-top:35px"><div class="section-head"><div><span class="eyebrow">Booking studio</span><h1 style="font-size:44px;margin-top:12px">Choose your ride.</h1></div><p>Search the fleet, then reserve the car that fits your trip.</p></div><form id="filters" class="searchbox"><div class="field"><label>SEARCH</label><input id="q" placeholder="Toyota, SUV..."></div><div class="field"><label>TYPE</label><select id="category"><option value="">All cars</option><option>Economy</option><option>Compact</option><option>Premium</option><option>SUV</option></select></div><div class="field"><label>MAX / DAY</label><input id="max" type="number" placeholder="$ any"></div><button class="btn btn-brand">Search</button></form><div id="grid" class="cars" style="margin-top:24px"></div></main><script>const API=window.__HATCHABLE__.api;const money=n=>'$'+Number(n).toFixed(0);const carImage=c=>'/cars/car-'+Math.min(9,Math.max(1,Number(c.id)||1))+'.jpg';async function load(){const p=new URLSearchParams();if(q.value)p.set('q',q.value);if(category.value)p.set('category',category.value);if(max.value)p.set('maxPrice',max.value);const r=await fetch(API+'/cars?'+p);const d=await r.json();grid.innerHTML=d.cars.map(c=>'<article class="car"><div class="car-img" style="background-image:url('+JSON.stringify(carImage(c))+')"></div><div class="car-body"><small style="color:var(--muted)">'+c.brand+' · '+c.category+'</small><h3 style="font-size:22px;margin-top:6px">'+c.name+'</h3><div class="tags"><span class="tag">'+c.seats+' seats</span><span class="tag">'+c.transmission+'</span><span class="tag">'+c.fuel+'</span></div><p style="color:var(--muted);font-size:13px;line-height:1.5">'+c.description+'</p><div class="price"><div><strong>'+money(c.price_per_day)+'</strong><span> / day</span></div><button class="btn btn-brand" onclick="book('+c.id+')">Reserve</button></div></div></article>').join('')||'<div class="empty">No cars found.</div>'}function book(id){location.href='/booking.html?car='+id}document.querySelector('#filters').onsubmit=e=>{e.preventDefault();load()};(async()=>{const s=await hatchable.auth.getSession();if(!s||!s.user){location.href='/login?next=/app.html';return}document.querySelector('#user').textContent=s.user.email;document.querySelector('#out').onclick=async()=>{await hatchable.auth.signOut();location.href='/'};load()})()</script></body></html>

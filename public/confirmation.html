<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DriveEase — Booking Confirmed</title><link rel="stylesheet" href="/theme.css"><style>
.confirm-wrap{padding:55px 0 90px}.confirm-card{max-width:850px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 18px 50px rgba(16,35,31,.08)}.hero{padding:38px 40px;background:#f1f7f0;text-align:center}.check{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#17623f;color:#fff;font-size:29px;font-weight:800;margin:0 auto 17px}.hero h1{font-size:40px;margin-bottom:9px}.hero p{color:var(--muted)}.ref{display:inline-block;margin-top:18px;padding:9px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font:800 13px Manrope}.body{padding:32px 40px}.vehicle{display:grid;grid-template-columns:210px 1fr;gap:20px;align-items:center;padding-bottom:25px;border-bottom:1px solid var(--line)}.vehicle-img{height:150px;border-radius:16px;background-size:cover;background-position:center}.vehicle h2{font-size:27px}.muted{color:var(--muted)}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{background:#edf2ef;border-radius:99px;padding:7px 9px;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}.item{background:#f7f9f7;border-radius:14px;padding:14px}.item label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:#71807b;margin-bottom:6px}.item strong{font-size:14px}.total{margin-top:22px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:end}.total strong{font:800 30px Manrope}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.error{max-width:650px;margin:80px auto;text-align:center}.topbar{height:72px;border-bottom:1px solid var(--line);background:#fff}.topbar .container{height:100%;display:flex;align-items:center;justify-content:space-between}.back{font-weight:700;color:var(--brand)}@media(max-width:700px){.hero{padding:32px 22px}.hero h1{font-size:32px}.body{padding:25px 20px}.vehicle{grid-template-columns:1fr}.vehicle-img{height:190px}.grid{grid-template-columns:1fr}}
</style></head><body><header class="topbar"><div class="container"><a class="logo" href="/">Drive<span>Ease</span></a><a class="back" href="/bookings.html">My bookings →</a></div></header><main class="confirm-wrap"><div class="container"><div id="loading" class="panel" style="max-width:650px;margin:auto;text-align:center">Loading your reservation…</div><div id="error" class="error" style="display:none"><h2>We couldn't load that booking.</h2><p class="muted" id="errorText"></p><a class="btn btn-brand" href="/bookings.html">View my bookings</a></div><article id="card" class="confirm-card" style="display:none"><div class="hero"><div class="check">✓</div><span class="eyebrow">Reservation confirmed</span><h1>You're all set.</h1><p>Your DriveEase reservation has been successfully confirmed.</p><div class="ref" id="ref"></div></div><div class="body"><div class="vehicle"><div id="image" class="vehicle-img"></div><div><small id="brand" class="muted"></small><h2 id="name"></h2><div id="chips" class="chips"></div></div></div><div class="grid"><div class="item"><label>Pickup</label><strong id="pickup"></strong><div id="pickupLoc" class="muted"></div></div><div class="item"><label>Return</label><strong id="dropoff"></strong><div id="dropoffLoc" class="muted"></div></div><div class="item"><label>Customer</label><strong id="customer"></strong><div id="phone" class="muted"></div></div><div class="item"><label>Rental period</label><strong id="days"></strong><div class="muted" id="status"></div></div></div><div class="total"><span class="muted">Total rental</span><strong id="total"></strong></div><div class="actions"><a class="btn btn-brand" href="/bookings.html">View my bookings</a><a class="btn btn-soft" href="/app.html">Browse more cars</a></div></div></article></div></main><script>
const API=window.__HATCHABLE__.api,$=id=>document.getElementById(id),money=n=>'$'+Number(n).toFixed(0);const carImage=b=>'/cars/car-'+Math.min(9,Math.max(1,Number(b.car_id)||1))+'.jpg';
const fmt=v=>new Date(v).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function init(){const s=await hatchable.auth.getSession();if(!s?.user){location.href='/login?next='+encodeURIComponent(location.pathname+location.search);return}const id=new URLSearchParams(location.search).get('id');if(!id){showError('No booking reference was provided.');return}try{const r=await fetch(API+'/my-bookings');const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load your bookings.');const b=d.bookings.find(x=>String(x.id)===String(id));if(!b)throw new Error('That booking could not be found in your account.');$('loading').style.display='none';$('card').style.display='block';$('ref').textContent='Booking #'+b.id;$('image').style.backgroundImage='url('+JSON.stringify(carImage(b))+')';$('brand').textContent=b.brand+' · '+b.category;$('name').textContent=b.car_name;$('chips').innerHTML='<span class="chip">'+b.seats+' seats</span><span class="chip">'+esc(b.transmission)+'</span><span class="chip">'+esc(b.fuel)+'</span>';$('pickup').textContent=fmt(b.pickup_at);$('pickupLoc').textContent=b.pickup_location;$('dropoff').textContent=fmt(b.dropoff_at);$('dropoffLoc').textContent=b.dropoff_location;$('customer').textContent=b.customer_name;$('phone').textContent=b.customer_phone;const days=Math.max(1,Math.ceil((new Date(b.dropoff_at)-new Date(b.pickup_at))/86400000));$('days').textContent=days+' '+(days===1?'day':'days');$('status').textContent='Status: '+b.status;$('total').textContent=money(b.total_amount)}catch(e){showError(e.message)}}function showError(m){$('loading').style.display='none';$('error').style.display='block';$('errorText').textContent=m}init();
</script></body></html>
